[genesyscloud:analytics:conversations:details]
TRUNCATE = 0
# ====================================================================
# CIM 5.x Performance Model Mappings:
#  CPU, Memory, Storage, Network, OS.Uptime
# ====================================================================
[genesyscloud:telephonyprovidersedge:edges:metrics]
EVAL-resource_type = "edge"
EVAL-dest = coalesce('edge.name', 'edge.id')
# ---- CPU: use "total" entry if present, otherwise average of all processors ----
EVAL-cpu_load_percent = round(if(isnotnull(mvfind('processors{}.cpuId', "(?i)^_?total$")), tonumber(mvindex('processors{}.activeTimePct', mvfind('processors{}.cpuId', "(?i)^_?total$"))), avg('processors{}.activeTimePct')), 2)
# ---- Memory (MB): uses the "physical" entry if present, else the first entry. Verify the type value. ----
EVAL-mem      = round(tonumber(mvindex('memory{}.totalBytes', coalesce(mvfind('memory{}.type', "(?i)physical"), 0))) / 1048576, 2)
EVAL-mem_free = round(tonumber(mvindex('memory{}.availableBytes', coalesce(mvfind('memory{}.type', "(?i)physical"), 0))) / 1048576, 2)
EVAL-mem_used = round((tonumber(mvindex('memory{}.totalBytes', coalesce(mvfind('memory{}.type', "(?i)physical"), 0))) - tonumber(mvindex('memory{}.availableBytes', coalesce(mvfind('memory{}.type', "(?i)physical"), 0)))) / 1048576, 2)
# ---- Storage (MB): Aggregate of all partitions ----
EVAL-mount                = "aggregate"
EVAL-storage              = round(sum('disks{}.totalBytes') / 1048576, 2)
EVAL-storage_free         = round(sum('disks{}.availableBytes') / 1048576, 2)
EVAL-storage_used         = round((sum('disks{}.totalBytes') - sum('disks{}.availableBytes')) / 1048576, 2)
EVAL-storage_used_percent = round((sum('disks{}.totalBytes') - sum('disks{}.availableBytes')) / sum('disks{}.totalBytes') * 100, 2)
EVAL-storage_free_percent = round(sum('disks{}.availableBytes') / sum('disks{}.totalBytes') * 100, 2)
# ---- Network (bits per second): sent + received, summed across all interfaces ----
EVAL-thruput     = round((sum('networks{}.sentBytesPerSec') + sum('networks{}.receivedBytesPerSec')) * 8, 2)
EVAL-thruput_max = sum('networks{}.bandwidthBitsPerSec')
# ---- Uptime (seconds) ----
EVAL-uptime = round(tonumber(upTimeMsec) / 1000, 0)
# ====================================================================
# CIM 5.x Change and Data_Access Model Mappings:
#  Change, Change.Account_Management, Data_Access
# ====================================================================
[genesyscloud:operational:audits]
# Preserve raw vendor rules
FIELDALIAS-gc_vendor_action = action AS vendor_action
FIELDALIAS-gc_vendor_status = status AS vendor_status
# ---- Object fields ----
FIELDALIAS-change_object = entity.name AS object
FIELDALIAS-change_object_id  = entity.id AS object_id
FIELDALIAS-gc_object_path = serviceName AS object_path
FIELDALIAS-gc_app = application AS app
# ---- Actor fields ----
FIELDALIAS-gc_src_user  = user.name AS src_user
FIELDALIAS-gc_user_name = user.name AS user_name
# Affected account for identity changes, actor otherwise ----
EVAL-user = if(match(entityType, "(?i)^(user|group|role|division)$"), 'entity.name', 'user.name')
# Extracts the primary originating IP address from the multi-value remoteIp array
EVAL-src = mvindex('remoteIp{}', 0)
# ---- Changed attributes ----
EVAL-object_attrs = 'propertyChanges{}.property'
# Change values: created, updated, modified, deleted, acl_modified
# Data_Access values: verify the expected "action" values in your installed CIM version
EVAL-action = case(match(vendor_action, "(?i)^(view|read)$"), "read", match(vendor_action, "(?i)^download$"), "download", match(vendor_action, "(?i)^export$"), "export", match(entityType, "(?i)^(role|group|division)$") AND match(vendor_action, "(?i)^(add|remove)$"), "acl_modified", match(vendor_action, "(?i)^(authorize|deauthorize|revoke|grant)$"), "acl_modified", match(vendor_action, "(?i)^(create|add|upload|copy)$"), "created", match(vendor_action, "(?i)^(delete|remove)$"), "deleted", match(vendor_action, "(?i)^(update|edit|modify|save)$"), "updated", isnotnull(vendor_action), "modified")
# ---- Status: success/failure only; raw value kept in result ----
EVAL-status = case(match(vendor_status, "(?i)^(success|warning)$"), "success", match(vendor_status, "(?i)^fail(ure|ed)?$"), "failure")
EVAL-result = coalesce('message.message', lower(vendor_status))
# ---- Classification ----
EVAL-change_type = if(match(entityType, "(?i)^(user|group|role|division)$"), "AAA", "application")
EVAL-object_category = lower(entityType)
# ---- Constants ----
EVAL-dest = "Genesys Cloud"
EVAL-dvc  = "Genesys Cloud"
EVAL-vendor_product = "Genesys Cloud"
