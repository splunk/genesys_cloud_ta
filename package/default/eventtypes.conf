[genesys_cloud_change]
# All write-type audit events. Read-only actions are excluded (they go to Data_Access).
search = sourcetype="genesyscloud:operational:audits" NOT vendor_action IN ("View","Read","Download","Export")

[genesys_cloud_account_management]
# Identity-related changes. Verify the entityType list with the discovery search.
search = eventtype=genesys_cloud_change entityType IN ("User","Group","Role","Division")

[genesys_cloud_data_access]
# Recording access (read-type). Deletes stay in Change as "deleted".
search = sourcetype="genesyscloud:operational:audits" entityType="Recording" vendor_action IN ("View","Read","Download","Export")

[genesys_cloud_edge_performance]
search = sourcetype="genesyscloud:telephonyprovidersedge:edges:metrics"
